name: Fetch GoatCounter Analytics

on:
  schedule:
    # Fora de la punta d'hora: GitHub retarda o descarta els crons a ':00'
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Fetch analytics data
        id: fetch
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_ACCOUNT: "pocallum-blog"
        run: |
          END=$(date +%Y-%m-%d)
          START=$(date -d '365 days ago' +%Y-%m-%d)
          BASE="https://${GC_ACCOUNT}.goatcounter.com/api/v0"
          AUTH="Authorization: Bearer ${GC_TOKEN}"

          CHECK=$(curl -s --max-time 10 -H "${AUTH}" "${BASE}/stats/total?start=${END}&end=${END}")
          if ! echo "${CHECK}" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
            echo "::warning::Token GoatCounter invàlid o expirat — actualitza el secret GOATCOUNTER_TOKEN a GitHub → Settings → Secrets."
            echo "token_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "token_ok=true" >> "$GITHUB_OUTPUT"

          fetch_json() {
            local url="$1"
            local result
            result=$(curl -s --max-time 15 --retry 2 -H "${AUTH}" "${url}" 2>/dev/null) || true
            if echo "${result}" | python3 -c "import sys,json; json.load(sys.stdin)" 2>/dev/null; then
              echo "${result}"
            else
              echo "null"
            fi
          }

          # /stats/hits amb PAGINACIÓ (exclude_paths per path_id, comes).
          # Sense això només arribem al top-100 paths del període i les
          # visites de la cua (pex. un post vist un cop avui) queden fora
          # de hits_by_day — el dashboard mostraria dies buits.
          export GC_BASE="${BASE}" GC_TOKEN="${GC_TOKEN}" GC_START="${START}" GC_END="${END}"
          python3 - << 'PYEOF' > /tmp/hits.json
import json, os, time, urllib.request

base  = os.environ["GC_BASE"]
token = os.environ["GC_TOKEN"]

def fetch(exclude):
    url = "%s?start=%s&end=%s&limit=100" % (base, os.environ["GC_START"], os.environ["GC_END"])
    if exclude:
        url += "&exclude_paths=" + ",".join(str(i) for i in exclude)
    req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token})
    with urllib.request.urlopen(req, timeout=20) as r:
        return json.load(r)

all_hits, exclude, pages = [], [], 0
while True:
    pages += 1
    data   = fetch(exclude)
    hits   = data.get("hits") or []
    all_hits.extend(hits)
    exclude.extend(h["path_id"] for h in hits if "path_id" in h)
    if not data.get("more") or not hits or pages >= 20:
        break
    time.sleep(0.3)  # rate limit: 4 req/s

print(json.dumps({"hits": all_hits, "more": False}))
import sys
print("paginacio: %d pagines, %d paths" % (pages, len(all_hits)), file=sys.stderr)
PYEOF
          fetch_json "${BASE}/stats/total?start=${START}&end=${END}"              > /tmp/total.json
          fetch_json "${BASE}/stats/browsers?start=${START}&end=${END}&limit=10"  > /tmp/browsers.json
          fetch_json "${BASE}/stats/systems?start=${START}&end=${END}&limit=10"   > /tmp/systems.json
          fetch_json "${BASE}/stats/sizes?start=${START}&end=${END}&limit=10"     > /tmp/sizes.json
          fetch_json "${BASE}/stats/locations?start=${START}&end=${END}&limit=15" > /tmp/locations.json
          fetch_json "${BASE}/stats/toprefs?start=${START}&end=${END}&limit=10"   > /tmp/refs.json

          python3 scripts/build-analytics-json.py "${START}" "${END}"

      - name: Process analytics
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          python3 scripts/process-analytics.py \
            /tmp/raw_all.json \
            static/stats/analytics.json \
            "$(date -d '365 days ago' +%Y-%m-%d)" \
            "$(date +%Y-%m-%d)"

      - name: Commit analytics
        id: commit
        if: steps.fetch.outputs.token_ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/stats/analytics.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update analytics"
            git pull --rebase origin develop
            git push origin develop
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploys
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un push fet amb GITHUB_TOKEN no dispara altres workflows (protecció
          # anti-bucle de GitHub), per això calem els deploys explícitament.
          gh workflow run deploy-staging.yml --ref develop
          gh workflow run deploy-produccio.yml --ref develop