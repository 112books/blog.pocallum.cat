name: Deploy → Staging (GitHub Pages)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-staging"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  hugo_extended_0.164.0_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Genera WebP de static/media (si cal)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          python3 - <<'PY'
          import glob, os, subprocess
          for src in sorted(glob.glob("static/media/*")):
              if not src.lower().endswith((".jpg", ".jpeg", ".png")):
                  continue
              base = os.path.splitext(src)[0]
              try:
                  w = int(subprocess.check_output(["identify", "-format", "%w", src]).decode().strip())
              except Exception:
                  continue
              for suf, cap in (("-800", 800), ("-2500", 2500)):
                  out = base + suf + ".webp"
                  if os.path.isfile(out):
                      continue
                  cmd = ["cwebp", "-quiet", "-q", "85"]
                  if w > cap:
                      cmd += ["-resize", str(cap), "0"]
                  cmd += [src, "-o", out]
                  subprocess.run(cmd, check=False)
          print("WebP de static/media a punt")
          PY

      - name: Build Hugo (staging, amb drafts, imatges apuntant al servidor)
        run: |
          hugo --minify \
               --baseURL "https://112books.github.io/blog.pocallum.cat/" \
               --buildDrafts

      - name: "Guarda — cap #ZgotmplZ al build"
        run: |
          fails=$(grep -rlE --include='*.html' '(srcset|src|href|content)="?#ZgotmplZ' public/ || true)
          if [ -n "$fails" ]; then
            echo "❌ El build conté #ZgotmplZ: una URL s'ha marcat com a insegura (normalment un espai al nom d'una imatge de /media/)."
            echo "   Fitxers afectats:"
            echo "$fails"
            echo "   Solució: renombra el fitxer sense espais o revisa themes/blog/layouts/partials/img.html."
            exit 1
          fi
          echo "✅ Cap #ZgotmplZ al build."

      - name: Index with Pagefind
        run: npx --yes pagefind@1.5.2 --site public

      - name: Deploy to GitHub Pages (branca gh-pages-staging)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages-staging

  notifica:
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Obre o actualitza un avís de fallada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh label create deploy-failure \
            --color d73a4a \
            --description "Fallada de deploy o pipeline" \
            --force 2>/dev/null || true
          BODY=$(cat <<EOF
          ⚠️ Ha fallat **${WORKFLOW}** (branca ${BRANCH}).

          - **Run:** ${RUN_URL}
          - **Commit:** ${COMMIT}
          - **Actor:** @${ACTOR}

          @112books revisa-ho. Quan estigui resolt, tanca aquest Issue.
          EOF
          )
          EXISTING=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create \
              --title "❌ Deploy fallit: ${WORKFLOW} (${BRANCH})" \
              --label deploy-failure \
              --body "${BODY}"
          fi
