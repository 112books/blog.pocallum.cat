name: Deploy → Producció (Dinahosting)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-produccio"
  cancel-in-progress: false  # no cancel·lis un deploy en curs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  hugo_extended_0.164.0_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Genera WebP de static/media (si cal)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          python3 - <<'PY'
          import glob, os, subprocess
          for src in sorted(glob.glob("static/media/*")):
              if not src.lower().endswith((".jpg", ".jpeg", ".png")):
                  continue
              base = os.path.splitext(src)[0]
              try:
                  w = int(subprocess.check_output(["identify", "-format", "%w", src]).decode().strip())
              except Exception:
                  continue
              for suf, cap in (("-800", 800), ("-2500", 2500)):
                  out = base + suf + ".webp"
                  if os.path.isfile(out):
                      continue
                  cmd = ["cwebp", "-quiet", "-q", "85"]
                  if w > cap:
                      cmd += ["-resize", str(cap), "0"]
                  cmd += [src, "-o", out]
                  subprocess.run(cmd, check=False)
          print("WebP de static/media a punt")
          PY

      - name: Build Hugo (producció)
        run: hugo --minify

      - name: "Guarda — cap #ZgotmplZ al build"
        run: |
          fails=$(grep -rlE --include='*.html' '(srcset|src|href|content)="?#ZgotmplZ' public/ || true)
          if [ -n "$fails" ]; then
            echo "❌ El build conté #ZgotmplZ: una URL s'ha marcat com a insegura (normalment un espai al nom d'una imatge de /media/)."
            echo "   Fitxers afectats:"
            echo "$fails"
            echo "   Solució: renombra el fitxer sense espais o revisa themes/blog/layouts/partials/img.html."
            exit 1
          fi
          echo "✅ Cap #ZgotmplZ al build."

      - name: Index with Pagefind
        run: npx --yes pagefind@1.5.2 --site public

      - name: Deploy a Dinahosting via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_DINAHOSTING }}
          KNOWN_HOSTS: ${{ secrets.DINAHOSTING_KNOWN_HOSTS }}
          REMOTE_HOST: ${{ secrets.DINAHOSTING_HOST }}
          REMOTE_USER: ${{ secrets.DINAHOSTING_USER }}
          REMOTE_PATH: ${{ secrets.DINAHOSTING_PATH }}   # ex: ~/www/blog
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Rsync: substitueix tot el contingut excepte wp-content/ i .well-known/.
          # --delay-updates + --delete-delay: aplica els canvis (i les esborrades) al
          #   final, de cop → si la connexió cau a mig camí, la web NO queda a mitges.
          # --partial: reaprofita el que ja s'ha transferit en el reintent.
          # --timeout i ServerAlive*: detecta connexions mortes en segons (abans s'esperava 5 min).
          # --no-perms --omit-dir-times: no pot canviar permisos ni timestamps del docroot arrel.
          # StrictHostKeyChecking=yes + known_hosts fix (secret): identitat del servidor verificada.
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o ConnectTimeout=15"
          ok=0
          for i in 1 2 3; do
            echo "→ rsync, intent ${i}/3"
            if rsync -rlz --delete-delay --delay-updates --partial --timeout=120 \
              --exclude='wp-content/' \
              --exclude='.well-known/' \
              --no-perms \
              --omit-dir-times \
              --stats \
              -e "ssh ${ssh_opts}" \
              public/ \
              "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"; then
              ok=1
              break
            fi
            echo "⚠️ rsync ha fallat (intent ${i}/3); reintent en 10 s…"
            sleep 10
          done
          if [ "${ok}" != "1" ]; then
            echo "❌ rsync no ha pogut completar el desplegament després de 3 intents."
            exit 1
          fi

  notifica:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Obre o actualitza un avís de fallada
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          gh label create deploy-failure \
            --color d73a4a \
            --description "Fallada de deploy o pipeline" \
            --force 2>/dev/null || true
          BODY=$(cat <<EOF
          ⚠️ Ha fallat **${WORKFLOW}** (branca ${BRANCH}).

          - **Run:** ${RUN_URL}
          - **Commit:** ${COMMIT}
          - **Actor:** @${ACTOR}

          @112books revisa-ho. Quan estigui resolt, tanca aquest Issue.
          EOF
          )
          EXISTING=$(gh issue list --label deploy-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create \
              --title "❌ Deploy fallit: ${WORKFLOW} (${BRANCH})" \
              --label deploy-failure \
              --body "${BODY}"
          fi
