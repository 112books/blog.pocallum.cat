name: Deploy → Producció (Dinahosting)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-produccio"
  cancel-in-progress: false  # no cancel·lis un deploy en curs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          echo "fea17b8c076f950bb2e9f9486667bdaa29422883888d509d63931c73e8a9b3a4  hugo_extended_0.164.0_linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Genera WebP de static/media (si cal)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq webp imagemagick
          python3 - <<'PY'
          import glob, os, subprocess
          for src in sorted(glob.glob("static/media/*")):
              if not src.lower().endswith((".jpg", ".jpeg", ".png")):
                  continue
              base = os.path.splitext(src)[0]
              try:
                  w = int(subprocess.check_output(["identify", "-format", "%w", src]).decode().strip())
              except Exception:
                  continue
              for suf, cap in (("-800", 800), ("-2500", 2500)):
                  out = base + suf + ".webp"
                  if os.path.isfile(out):
                      continue
                  cmd = ["cwebp", "-quiet", "-q", "85"]
                  if w > cap:
                      cmd += ["-resize", str(cap), "0"]
                  cmd += [src, "-o", out]
                  subprocess.run(cmd, check=False)
          print("WebP de static/media a punt")
          PY

      - name: Build Hugo (producció)
        run: hugo --minify

      - name: Index with Pagefind
        run: npx --yes pagefind@1.5.2 --site public

      - name: Deploy a Dinahosting via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_DINAHOSTING }}
          KNOWN_HOSTS: ${{ secrets.DINAHOSTING_KNOWN_HOSTS }}
          REMOTE_HOST: ${{ secrets.DINAHOSTING_HOST }}
          REMOTE_USER: ${{ secrets.DINAHOSTING_USER }}
          REMOTE_PATH: ${{ secrets.DINAHOSTING_PATH }}   # ex: ~/www/blog
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Rsync: substitueix tot el contingut excepte wp-content/ i .well-known/.
          # --no-perms --omit-dir-times: no pot canviar permisos ni timestamps del docroot arrel.
          # StrictHostKeyChecking=yes + known_hosts fix (secret): identitat del servidor verificada.
          rsync -rlzv --delete \
            --exclude='wp-content/' \
            --exclude='.well-known/' \
            --no-perms \
            --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            public/ \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"

          # security.txt viu a .well-known/, que el rsync principal exclou (permisos).
          # L'afegim a part, sense --delete, per no tocar l'acme-challenge.
          rsync -az --no-perms --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            public/.well-known/security.txt \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/.well-known/security.txt" || true
