name: Deploy → Producció (Dinahosting)

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: "pages-produccio"
  cancel-in-progress: false  # no cancel·lis un deploy en curs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          tar -xzf hugo_extended_0.164.0_linux-amd64.tar.gz
          sudo mv hugo /usr/local/bin/

      - name: Build Hugo (producció)
        run: hugo --minify

      - name: "Guarda — cap #ZgotmplZ al build"
        run: |
          fails=$(grep -rlE --include='*.html' '(srcset|src|href|content)="?#ZgotmplZ' public/ || true)
          if [ -n "$fails" ]; then
            echo "❌ El build conté #ZgotmplZ: una URL s'ha marcat com a insegura (normalment un espai al nom d'una imatge de /media/)."
            echo "   Fitxers afectats:"
            echo "$fails"
            echo "   Solució: renombra el fitxer sense espais o revisa themes/blog/layouts/partials/img.html."
            exit 1
          fi
          echo "✅ Cap #ZgotmplZ al build."

      - name: "Guarda — cap markdown d'imatge sense renderitzar"
        run: |
          fails=$(grep -rlP --include='*.html' '!\[.+?\]\(/' public/ || true)
          if [ -n "$fails" ]; then
            echo "❌ El build conté sintaxi markdown d'imatge sense renderitzar (![alt](url)): goldmark no ha pogut parsejar la URL (normalment espais sense encodar al nom del fitxer)."
            echo "   Fitxers afectats:"
            echo "$fails"
            echo "   Solució: percent-encoda els espais a la URL de la imatge al contingut del post (%20)."
            exit 1
          fi
          echo "✅ Cap markdown d'imatge sense renderitzar."

      - name: Index with Pagefind
        run: npx pagefind --site public

      - name: Deploy a Dinahosting via rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_DINAHOSTING }}
          REMOTE_HOST: ${{ secrets.DINAHOSTING_HOST }}
          REMOTE_USER: ${{ secrets.DINAHOSTING_USER }}
          REMOTE_PATH: ${{ secrets.DINAHOSTING_PATH }}   # ex: ~/www/blog
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts
          echo "--- known_hosts lines: $(wc -l < ~/.ssh/known_hosts) ---"

          # Rsync: substitueix tot el contingut excepte wp-content/ i .well-known/.
          # --no-perms --omit-dir-times: no pot canviar permisos ni timestamps del docroot arrel.
          # -e ssh StrictHostKeyChecking=no: fallback si ssh-keyscan no ha afegit la clau host.
          rsync -rlzv --delete \
            --exclude='wp-content/' \
            --exclude='.well-known/' \
            --no-perms \
            --omit-dir-times \
            -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=~/.ssh/known_hosts" \
            public/ \
            "${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}/"
