name: _diag stats (temporal)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: GoatCounter diagnostic
        env:
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GC_ACCOUNT: "pocallum-blog"
        run: |
          BASE="https://${GC_ACCOUNT}.goatcounter.com/api/v0"
          AUTH="Authorization: Bearer ${GC_TOKEN}"
          END=$(date +%F)
          D7=$(date -d '7 days ago' +%F)
          D30=$(date -d '30 days ago' +%F)
          echo "AVUI=${END}"
          echo "== total avui =="
          curl -s --max-time 20 -H "${AUTH}" "${BASE}/stats/total?start=${END}&end=${END}"; echo
          echo "== total 30 dies =="
          curl -s --max-time 20 -H "${AUTH}" "${BASE}/stats/total?start=${D30}&end=${END}"; echo
          echo "== hits avui (limit 5) =="
          curl -s --max-time 20 -H "${AUTH}" "${BASE}/stats/hits?start=${END}&end=${END}&limit=5"; echo
          echo "== hits 7 dies (limit 10) =="
          curl -s --max-time 20 -H "${AUTH}" "${BASE}/stats/hits?start=${D7}&end=${END}&limit=10"; echo
