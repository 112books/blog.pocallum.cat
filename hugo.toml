baseURL = "https://blog.pocallum.cat/"
title   = "Blog de Pocallum — camera & action!"
theme   = "blog"
enableRobotsTXT = true
enableGitInfo   = false
disableHugoGeneratorInject = true
summaryLength   = 70
buildFuture     = true
timeZone        = "Europe/Madrid"
languageCode    = "ca"
defaultContentLanguage = "ca"

[pagination]
  pagerSize = 12   # com el WordPress actual (2.353 posts / 197 pàgines)

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"   # genera /feed.xml — compatibilitat amb el /feed/ del WordPress pendent a QA (fase 6)

[taxonomies]
  category = "categories"
  tag      = "tags"

[services]
  [services.rss]
    limit = 10   # com el /feed/ del WordPress (10 últims posts)

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[params]
  author      = "Joan Linux Martínez"
  description = "Crònica fotogràfica tal com raja. Des del 2010."
  instagram   = "https://www.instagram.com/pocallum"
  facebook    = "https://www.facebook.com/pocallum"
  flickr      = "https://www.flickr.com/photos/linuxbcn/"
  fiveHundredPx = "https://500px.com/p/linuxbcn"
  webPare     = "https://pocallum.cat"
  defaultOgImage = "https://blog.pocallum.cat/wp-content/uploads/2014/04/7706-Bronica-CN400-014.jpg"
  goatcounterSite = "blog-pocallum"   # pendent de crear a goatcounter.com

  # giscus — comentaris via GitHub Discussions
  # Activar: 1) habilitar Discussions al repo, 2) instal·lar app a giscus.app,
  #          3) omplir giscusRepoId i giscusCategoryId amb els valors de giscus.app
  giscusRepo       = "112books/blog.pocallum.cat"
  giscusRepoId     = "R_kgDOUarUZA"
  giscusCategoryId = "DIC_kwDOUarUZM4DFoz1"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false

# ── Menús ─────────────────────────────────────────────────────────────

[[menus.main]]
  name   = "Inici"
  url    = "/"
  weight = 1

[[menus.main]]
  name   = "Arxiu"
  url    = "/arxiu/"
  weight = 2

[[menus.main]]
  name   = "Pocallum.cat"
  url    = "https://pocallum.cat"
  weight = 3

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 4

[[menus.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 5
