baseURL = "https://blog.pocallum.cat/"
title   = "Blog de Pocallum — camera & action!"
theme   = "blog"
enableRobotsTXT = true
enableGitInfo   = false
disableHugoGeneratorInject = true
summaryLength   = 70
buildFuture     = true
timeZone        = "Europe/Madrid"
languageCode    = "ca"
defaultContentLanguage = "ca"

[pagination]
  pagerSize = 12   # com el WordPress actual (2.353 posts / 197 pàgines)

[outputs]
  home    = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"   # genera /feed.xml — compatibilitat amb el /feed/ del WordPress pendent a QA (fase 6)

[taxonomies]
  category = "categories"
  tag      = "tags"

[permalinks]
  posts = "/:year/:month/:day/:slug/"

[params]
  author      = "Joan Linux Martínez"
  description = "Crònica fotogràfica tal com raja. Des del 2010."
  instagram   = "https://www.instagram.com/pocallum"
  facebook    = "https://www.facebook.com/pocallum"
  webPare     = "https://pocallum.cat"
  goatcounterSite = "blog-pocallum"   # pendent de crear a goatcounter.com

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false

# ── Menús ─────────────────────────────────────────────────────────────

[[menus.main]]
  name   = "Inici"
  url    = "/"
  weight = 1

[[menus.main]]
  name   = "Pocallum.cat"
  url    = "https://pocallum.cat"
  weight = 2

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 3

[[menus.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 4

[[menus.main]]
  name   = "Cerca"
  url    = "/cerca/"
  weight = 5
