baseURL = "https://blog.pocallum.cat/"
title   = "Blog de Pocallum — camera & action!"
theme   = "blog"
enableRobotsTXT = true
enableGitInfo   = false
disableHugoGeneratorInject = true
summaryLength   = 70
buildFuture     = true
timeZone        = "Europe/Madrid"
languageCode    = "ca"
defaultContentLanguage = "ca"

[pagination]
  pagerSize = 12   # com el WordPress actual (2.353 posts / 197 pàgines)

[outputs]
  home    = ["HTML", "RSS", "llms"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    baseName = "feed"   # genera /feed.xml; el /feed/ del WP es serveix via rewrite al .htaccess
  [outputFormats.llms]
    baseName   = "llms"     # genera /llms.txt — guia per a cercadors d'IA (conveni llms.txt)
    mediaType  = "text/plain"
    isPlainText = true

[taxonomies]
  category = "categories"
  tag      = "tags"

[services]
  [services.rss]
    limit = 10   # com el /feed/ del WordPress (10 últims posts)

[permalinks]
  posts = "/:year/:month/:day/:slug/"

  # Paritat d'URLs d'arxius amb el WordPress (15 anys d'indexació):
  # el WP servia /tag/<slug>/ (flat) i /category/<pare>/<fill>/ (jeràrquic).
  # Hugo genera /tag/<slug>/ i /category/<fill>/ (aplanat). Les URLs jeràrquiques
  # del WP i les plurals provisionals es cobreixen amb 301 al .htaccess.
  # Pares WP: camara, optiaca, publicacions (85 fills, cap top-level).
  [permalinks.term]
    tags       = "/tag/:slug"
    categories = "/category/:slug"
  [permalinks.taxonomy]
    tags       = "/tags"        # índex de totes les etiquetes
    categories = "/categories"  # índex de càmeres i òptiques (browser)

[params]
  author      = "Joan Linux Martínez"
  description = "Crònica fotogràfica tal com raja. Des del 2010."
  instagram   = "https://www.instagram.com/pocallum"
  facebook    = "https://www.facebook.com/pocallum"
  webPare     = "https://pocallum.cat"
  defaultOgImage = "https://blog.pocallum.cat/wp-content/uploads/2025/09/2025-09-16-LC-A-Foma400-Varies-0007-1536x942.jpg"  # = imatgeFons de la portada (últim recurs; seo.html ja prioritza imatgeFons)
  goatcounterSite = "pocallum-blog"
  imatgesWebp = false  # true: serveix WebP adjacent (-2500.webp / -800.webp) quan estiguin pujats al servidor

  # giscus — comentaris via GitHub Discussions
  # Activar: 1) habilitar Discussions al repo, 2) instal·lar app a giscus.app,
  #          3) omplir giscusRepoId i giscusCategoryId amb els valors de giscus.app
  # Formulari de contacte (Formspree — formspree.io/forms → New Form → copia l'ID)
  formspreeId = ""   # ex: "xrgjabnk" — obtenir a formspree.io

  giscusRepo       = "112books/blog.pocallum.cat"
  giscusRepoId     = "R_kgDOUarUZA"
  giscusCategoryId = "DIC_kwDOUarUZM4DFoz1"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[minify]
  disableCSS  = false
  disableHTML = false
  disableJS   = false

# ── Menús ─────────────────────────────────────────────────────────────

[[menus.main]]
  name   = "Inici"
  url    = "/"
  weight = 1

[[menus.main]]
  name   = "Arxiu"
  url    = "/arxiu/"
  weight = 2

[[menus.main]]
  name   = "Pocallum.cat"
  url    = "https://pocallum.cat"
  weight = 3

[[menus.main]]
  name   = "About"
  url    = "/about/"
  weight = 4

[[menus.main]]
  name   = "Contact"
  url    = "/contact/"
  weight = 5

