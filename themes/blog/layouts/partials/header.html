<header class="site-header" id="js-header">
  <nav class="nav" aria-label="Navegació principal">

    <a href="{{ .Site.Home.RelPermalink }}" class="nav-logo" aria-label="{{ .Site.Title }}">
      <span class="nav-logo-name">blog<span class="nav-logo-dot">.</span>pocallum<span class="nav-logo-dot">.</span>cat</span>
    </a>

    <button class="nav-toggle" id="js-nav-toggle" aria-expanded="false" aria-controls="js-nav-menu"
            aria-label="Obre el menú">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-menu" id="js-nav-menu" hidden>
      <ul class="nav-links" role="list">
        {{ range .Site.Menus.main }}
        {{ $isExternal := strings.HasPrefix .URL "http" }}
        <li>
          <a href="{{ if $isExternal }}{{ .URL }}{{ else }}{{ .URL | relLangURL }}{{ end }}"
             class="nav-link{{ if $.IsMenuCurrent "main" . }} is-active{{ end }}{{ if $isExternal }} is-external{{ end }}"
             {{ if $isExternal }}target="_blank" rel="noopener noreferrer"{{ end }}>
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>

      <a href="{{ "cerca/" | relLangURL }}" class="nav-search-btn"
         aria-label="Cercar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>
    </div>

  </nav>
</header>
