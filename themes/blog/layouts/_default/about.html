{{ define "main" }}
{{ $bg := .Params.imatgeFons | default "https://blog.pocallum.cat/wp-content/uploads/2025/09/2025-09-16-LC-A-Foma400-Varies-0007-1536x942.jpg" }}
<div class="contact-fullpage" style="background-image:url('{{ $bg }}')">
  <div class="contact-fullpage-overlay" aria-hidden="true"></div>
  <div class="contact-fullpage-content container--narrow">
    <header class="contact-fullpage-header">
      <p class="page-eyebrow">About</p>
      <h1 class="page-title">{{ .Title }}</h1>
    </header>
    <div class="about-content prose">
      {{ .Content }}
    </div>
  </div>
</div>
{{ end }}
