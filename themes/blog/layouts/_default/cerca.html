{{ define "main" }}
<header class="page-header">
  <div class="container--narrow">
    <p class="page-eyebrow">Cerca al blog</p>
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</header>
<div class="cerca-page">
  <div class="cerca-wrap">
    <div id="js-cerca"></div>
  </div>
</div>

{{ with .OutputFormats.Get "RSS" }}
<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">
{{ end }}
<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', () => {
    new PagefindUI({
      element: '#js-cerca',
      showSubResults: true,
      showImages: true,
      excerptLength: 25,
      translations: {
        placeholder: 'Cerca al blog…',
        zero_results: 'Cap resultat per a [SEARCH_TERM]'
      }
    });

    const params = new URLSearchParams(window.location.search);
    const q = params.get('q');
    if (q) {
      const input = document.querySelector('.pagefind-ui__search-input');
      if (input) { input.value = q; input.dispatchEvent(new Event('input')); }
    }
  });
</script>
{{ end }}
